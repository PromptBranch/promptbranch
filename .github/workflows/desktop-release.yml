name: Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build (${{ matrix.platform }}-${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            arch: arm64
            args: --mac --arm64
          - os: macos-15-intel
            platform: mac
            arch: x64
            args: --mac --x64
          - os: windows-latest
            platform: win
            arch: x64
            args: --win --x64
          - os: windows-11-arm
            platform: win
            arch: arm64
            args: --win --arm64
          - os: ubuntu-latest
            platform: linux
            arch: x64
            args: --linux --x64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            args: --linux --arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools fuse libfuse2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Desktop App Icons
        run: node apps/desktop/scripts/verify-desktop-icons.mjs

      - name: Build unsigned macOS verification artifacts
        if: runner.os == 'macOS' && github.event_name == 'workflow_dispatch'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm --filter @promptbranch/desktop dist ${{ matrix.args }} --publish never

      - name: Build and publish unsigned macOS artifacts
        if: runner.os == 'macOS' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm --filter @promptbranch/desktop dist ${{ matrix.args }} --publish always

      - name: Build unsigned Windows verification artifacts
        if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm --filter @promptbranch/desktop dist ${{ matrix.args }} --publish never

      - name: Build and publish unsigned Windows artifacts
        if: runner.os == 'Windows' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm --filter @promptbranch/desktop dist ${{ matrix.args }} --publish always

      - name: Build Linux verification artifacts
        if: runner.os == 'Linux' && github.event_name == 'workflow_dispatch'
        run: pnpm --filter @promptbranch/desktop dist ${{ matrix.args }} --publish never

      - name: Build and publish Linux artifacts
        if: runner.os == 'Linux' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm --filter @promptbranch/desktop dist ${{ matrix.args }} --publish always

      - name: Verify packaged architecture
        run: >-
          node apps/desktop/scripts/verify-release-architecture.mjs
          --platform ${{ matrix.platform }}
          --arch ${{ matrix.arch }}
          --dist apps/desktop/dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: promptbranch-${{ matrix.platform }}-${{ matrix.arch }}
          path: apps/desktop/dist/
          if-no-files-found: error

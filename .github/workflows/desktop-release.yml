name: Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build (${{ matrix.platform }}-${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            arch: arm64
            args: --mac --arm64
          - os: macos-15-intel
            platform: mac
            arch: x64
            args: --mac --x64
          - os: windows-latest
            platform: win
            arch: x64
            args: --win --x64
          - os: windows-11-arm
            platform: win
            arch: arm64
            args: --win --arm64
          - os: ubuntu-latest
            platform: linux
            arch: x64
            args: --linux --x64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            args: --linux --arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools fuse libfuse2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure Electron runtime is complete
        run: node apps/desktop/node_modules/electron/install.js

      - name: Verify Desktop App Icons
        run: node apps/desktop/scripts/verify-desktop-icons.mjs

      - name: Read desktop version
        id: package
        shell: bash
        run: node -p "'version=' + require('./apps/desktop/package.json').version" >> "$GITHUB_OUTPUT"

      - name: Validate macOS release credentials
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required macOS release secret: ${name}"
              missing=1
            fi
          done
          exit "$missing"

      - name: Build signed and notarized macOS artifacts
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm --filter @promptbranch/desktop dist ${{ matrix.args }} --publish never

      - name: Build unsigned Windows artifacts
        if: runner.os == 'Windows'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm --filter @promptbranch/desktop dist ${{ matrix.args }} --publish never

      - name: Build Linux artifacts
        if: runner.os == 'Linux'
        run: pnpm --filter @promptbranch/desktop dist ${{ matrix.args }} --publish never

      - name: Verify packaged architecture
        run: >-
          node apps/desktop/scripts/verify-release-architecture.mjs
          --platform ${{ matrix.platform }}
          --arch ${{ matrix.arch }}
          --dist apps/desktop/dist

      - name: Verify macOS signing and notarization
        if: runner.os == 'macOS'
        run: node apps/desktop/scripts/verify-macos-distribution.mjs --dist apps/desktop/dist

      - name: Stage user-installable artifacts
        run: >-
          node apps/desktop/scripts/collect-release-installers.mjs
          --platform ${{ matrix.platform }}
          --arch ${{ matrix.arch }}
          --version ${{ steps.package.outputs.version }}
          --dist apps/desktop/dist
          --out apps/desktop/release-artifacts

      - name: Upload staged installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: promptbranch-${{ matrix.platform }}-${{ matrix.arch }}
          path: apps/desktop/release-artifacts/
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Assemble draft GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build-desktop
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Download verified installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: promptbranch-*
          path: release-artifacts
          merge-multiple: true

      - name: Reject updater metadata and incomplete release sets
        shell: bash
        run: |
          if find release-artifacts -type f \( -name '*.yml' -o -name '*.blockmap' \) | grep -q .; then
            echo "::error::Updater metadata must not be published as a user-facing release asset"
            exit 1
          fi
          count=$(find release-artifacts -maxdepth 1 -type f | wc -l | tr -d ' ')
          if [[ "$count" != "10" ]]; then
            echo "::error::Expected 10 installers, found $count"
            find release-artifacts -maxdepth 1 -type f -print
            exit 1
          fi

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --generate-notes --title "PromptBranch ${GITHUB_REF_NAME#v}"
          fi
          gh release upload "$GITHUB_REF_NAME" release-artifacts/* --clobber

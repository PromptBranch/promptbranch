# Keeps the commit-SHA pins in .github/workflows/* current, so actions never
# float on mutable version tags.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # The root pnpm workspace resolves every apps/* and packages/* manifest and
  # regenerates the shared pnpm-lock.yaml. Listing those directories separately
  # makes Dependabot scan the same manifests twice and can create manifest-only
  # duplicate PRs that fail CI's frozen-lockfile install. Minor and patch bumps
  # are grouped into one weekly PR; majors stay as individual PRs so a breaking
  # electron/better-sqlite3 bump (ABI-sensitive pair) fails alone instead of
  # poisoning the group.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

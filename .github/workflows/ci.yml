name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Pull-request code executes in this job (postinstall scripts, tests, builds),
# so the workflow token stays read-only and checkout credentials are not left
# in the git config for later steps — i.e. PR-supplied code — to reuse.
permissions:
  contents: read

jobs:
  test:
    name: Typecheck, Test & Build
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: License check
        run: node scripts/check-licenses.mjs

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Publishing authenticates with the NPM_TOKEN secret; the workflow token only
# needs read access to check the tag out.
permissions:
  contents: read

jobs:
  publish:
    name: Publish Packages (@promptbranch/*)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm -r build

      - name: Sync LICENSE + third-party notices into packages
        run: node scripts/sync-package-licenses.mjs

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          pnpm --filter @promptbranch/share publish --access public --no-git-checks
          pnpm --filter @promptbranch/core publish --access public --no-git-checks
          pnpm --filter @promptbranch/ai publish --access public --no-git-checks
          pnpm --filter @promptbranch/mcp publish --access public --no-git-checks
          pnpm --filter @promptbranch/cli publish --access public --no-git-checks
